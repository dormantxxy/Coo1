name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 固定 SDK 路径，避免 “SDK location not found”
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (dependency + build cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      #  runner 镜像自带 SDK；这里只补 cmdline-tools 并确保可用
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      #  关键：安装工程需要的平台与构建工具（compileSdk=35），并接受 license
      - name: Install required SDK packages
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT}"
          if [ -d "/usr/local/lib/android/sdk" ]; then SDK="/usr/local/lib/android/sdk"; fi
          export ANDROID_SDK_ROOT="$SDK"
          export ANDROID_HOME="$SDK"
          echo "Using SDK: $SDK"
          yes 2>/dev/null | sdkmanager --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root="$SDK" "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "sdk.dir=$SDK" > local.properties
          cat local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: >
          ./gradlew :app:assembleRelease
          --parallel
          --build-cache
          --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Coo1-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore
