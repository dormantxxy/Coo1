name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # 需要 write 才能创建 Release 并上传 APK 资产
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (dependency + build cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      # 直接复用 runner 预装的 Android SDK，不用 setup-android action（那步 sdkmanager --licenses 会失败）
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          export ANDROID_HOME="$SDK"
          # 写 local.properties，避免 “SDK location not found”
          echo "sdk.dir=$SDK" > local.properties
          cat local.properties
          # 接受 license（失败不阻断后续）
          SDKMANAGER="$(command -v sdkmanager || echo "$SDK/cmdline-tools/latest/bin/sdkmanager")"
          echo "sdkmanager=$SDKMANAGER"
          yes 2>/dev/null | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          # 安装 compileSdk=35 所需包（已存在则跳过）
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          ls "$SDK/platforms" "$SDK/build-tools" || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: >
          ./gradlew :app:assembleRelease
          --parallel
          --build-cache
          --stacktrace

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Coo1-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 永久保存：自动发布到 Releases，固定下载链接、不过期
      - name: Publish Release (permanent)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Coo1 ${{ github.run_number }}
          body: |
            自动构建产物（永久保存）
            - commit: ${{ github.sha }}
            - run: ${{ github.run_id }}
          files: app/build/outputs/apk/release/*.apk
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore
